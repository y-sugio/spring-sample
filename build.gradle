plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    // TODO: SAML 導入時に有効化。OpenSAML（spring-security-saml2-service-provider の推移的依存）は
    //       Maven Central になく Shibboleth リポジトリが必要
    // maven { url 'https://build.shibboleth.net/maven/releases/' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    // TODO: SAML 認証（Azure Entra ID）導入時に有効化（実装スケルトンは config/SamlConfig.java）
    // implementation 'org.springframework.security:spring-security-saml2-service-provider'

    // AOP（LoggingAspect）
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    // @Transactional（MyBatis 導入までは TransactionManager なしのため実質無効）
    implementation 'org.springframework:spring-tx'

    // MyBatis コア（LocalDateTypeHandler の実装用）
    // TODO: DB 接続確定後に mybatis-spring-boot-starter へ置き換える（DataSource が必要なため現状は core のみ）
    implementation 'org.mybatis:mybatis:3.5.16'

    // TODO: Azure Key Vault 連携（DB パスワード等のシークレット取得）。エンドポイント確定後に有効化する
    // implementation 'com.azure.spring:spring-cloud-azure-starter-keyvault-secrets:5.22.0'

    // TODO: Oracle JDBC ドライバ（thin。19c 相当の通信規格をカバー。Client・Wallet 不要の見込み）。
    //       DB 接続確定後に有効化する
    // implementation 'com.oracle.database.jdbc:ojdbc11'

    // （任意）Lombokを使うなら
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // bootstrap
    implementation 'org.webjars:bootstrap:5.3.3'
    implementation 'org.webjars:webjars-locator-core:0.56'
}

tasks.test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
