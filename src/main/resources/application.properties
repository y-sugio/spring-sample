spring.web.encoding.charset=UTF-8
spring.web.encoding.enabled=true
spring.web.encoding.force=true

spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# セッションタイムアウト
# TODO: タイムアウト時間は未確定（requirements/overview.md §7）。30m は仮の値
server.servlet.session.timeout=30m

# 業務時間チェック（BusinessHoursFilter）
# TODO: 業務サービス状況テーブル確定後は InMemoryBusinessHoursMapper を MyBatis 実装へ置き換える。
#       true にすると業務時間外の動作（error/business-hours.html への遷移）を確認できる
app.business-hours.force-closed=false

# SAML 認証（Azure Entra ID）
# TODO: メタデータ URL・アサーション属性名の確定後に true にする（config/SamlConfig.java 参照）
app.saml.enabled=false

# Oracle Wallet
# TODO: Key Vault からの取得・展開方法の確定後に設定する（config/OracleWalletInitializer.java 参照）
#app.oracle.wallet-location=/path/to/wallet

# DB 接続（Oracle + MyBatis 導入時に有効化）
# TODO: 接続情報は Azure Key Vault のシークレット参照で書く。直書き禁止（coding-rules.md §11）
#spring.datasource.url=${db-url}
#spring.datasource.username=${db-username}
#spring.datasource.password=${db-password}
#mybatis.type-handlers-package=demo.common.mapper.typehandler

# Azure Key Vault（spring-cloud-azure-starter-keyvault-secrets 有効化時に設定）
# TODO: Key Vault のエンドポイント確定後に有効化。認証は DefaultAzureCredential
#       （Azure 上=マネージド ID / ローカル=az login）で自動切り替え
#spring.cloud.azure.keyvault.secret.property-sources[0].endpoint=https://<vault-name>.vault.azure.net/

# MDC（trackingId / userId / clientIp）を全ログ行に出力する
logging.pattern.console=[%X{trackingId}] [%X{userId}] [%X{clientIp}] %d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
# レイヤーの開始・終了ログ（LoggingAspect）は DEBUG で出力
logging.level.demo=DEBUG
