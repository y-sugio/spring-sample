# メッセージ管理
# フォーマット: メッセージID=メッセージID メッセージ本文
# ※プレフィックス文字列は仮。確定次第変更する。

# -------------------------------------------------------
# 処理完了メッセージ（MSG）
# -------------------------------------------------------
MSG001=MSG001 登録が完了しました。
MSG002=MSG002 更新が完了しました。
MSG003=MSG003 削除が完了しました。

# -------------------------------------------------------
# バリデーションエラー（VAL）
# -------------------------------------------------------
VAL001=VAL001 必須項目です。
VAL002=VAL002 {max}文字以内で入力してください。
VAL003=VAL003 正しい形式で入力してください。

# -------------------------------------------------------
# 業務例外（BIZ）
# -------------------------------------------------------
BIZ001=BIZ001 該当するデータが見つかりません。
BIZ002=BIZ002 既に登録されています。

# -------------------------------------------------------
# システム例外（SYS）
# -------------------------------------------------------
SYS001=SYS001 システムエラーが発生しました。管理者にお問い合わせください。
